  <line x1="196" y1="219.5" x2="352" y2="219.5" stroke="#367BF5" stroke-width="2"/>
  <line x1="352" y1="219.5" x2="508" y2="219.5" stroke="#08B8D8" stroke-width="2"/>
  <text class="sans muted" x="40" y="242" font-size="8.5" font-weight="750" letter-spacing="1.2">01</text>
  <text class="sans ink" x="40" y="260" font-size="10.5" font-weight="700" letter-spacing="0.45">BROWSER SYSTEMS</text>
  <text class="sans muted" x="196" y="242" font-size="8.5" font-weight="750" letter-spacing="1.2">02</text>
  <text class="sans ink" x="196" y="260" font-size="10.5" font-weight="700" letter-spacing="0.45">NATIVE macOS</text>
  <text class="sans muted" x="352" y="242" font-size="8.5" font-weight="750" letter-spacing="1.2">03</text>
  <text class="sans ink" x="352" y="260" font-size="10.5" font-weight="700" letter-spacing="0.45">AI-ASSISTED CRAFT</text>

