    <text class="sans muted" x="504" y="41" text-anchor="end" font-size="9" font-weight="700" letter-spacing="1.4">OPEN SOURCE · UTC+8</text>
  </g>

  <text class="sans ink" x="40" y="100" font-size="45" font-weight="760" letter-spacing="-2.2">Small tools.</text>
  <text class="sans ink" x="40" y="145" font-size="45" font-weight="760" letter-spacing="-2.2">Real workflows.</text>
  <rect x="40" y="159" width="76" height="4" rx="2" fill="url(#accent)"/>
  <text class="sans muted" x="40" y="187" font-size="13">I turn recurring browser, macOS, and developer friction into focused software.</text>

