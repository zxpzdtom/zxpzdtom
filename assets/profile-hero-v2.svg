      .panel { fill: #0F1621; stroke: #202B3B; }
      .ink { fill: #F4F7FB; }
      .muted { fill: #94A1B5; }
      .hairline { stroke: #29364A; }
      .node { fill: #111925; stroke: #314159; }
    }
  </style>

