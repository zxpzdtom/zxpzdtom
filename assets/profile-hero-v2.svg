    .core { fill: #FFFFFF; stroke: #EEF2F7; }
    .panel { fill: #F8FAFD; stroke: #E3E9F1; }
    .ink { fill: #111827; }
    .muted { fill: #68758A; }
    .hairline { stroke: #D8E0EB; }
    .node { fill: #FFFFFF; stroke: #CBD6E5; }
    .sans { font-family: 'Plus Jakarta Sans', 'Avenir Next', 'Segoe UI', sans-serif; }
    @media (prefers-color-scheme: dark) {
      .canvas { fill: #090D14; stroke: #1D2634; }
