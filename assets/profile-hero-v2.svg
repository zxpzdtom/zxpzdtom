<svg width="850" height="288" viewBox="0 0 850 288" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Tom — Product Engineer and Indie Maker</title>
  <desc id="desc">An editorial banner about building focused tools for browsers, macOS, and AI-assisted workflows.</desc>
  <defs>
    <linearGradient id="accent" x1="42" y1="36" x2="808" y2="252" gradientUnits="userSpaceOnUse">
      <stop stop-color="#7C5CFF"/>
      <stop offset="0.5" stop-color="#367BF5"/>
      <stop offset="1" stop-color="#08B8D8"/>
    </linearGradient>
    <radialGradient id="glow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(741 54) rotate(133) scale(245 205)">
      <stop stop-color="#7C5CFF" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#7C5CFF" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <style>
