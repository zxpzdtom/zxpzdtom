<svg width="850" height="218" viewBox="0 0 850 218" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Tom's three working systems</title>
  <desc id="desc">An open editorial map of browser systems, native macOS utilities, and AI-assisted craft.</desc>
  <defs>
    <linearGradient id="accent" x1="28" y1="50" x2="822" y2="50" gradientUnits="userSpaceOnUse">
      <stop stop-color="#7C5CFF"/>
      <stop offset="0.5" stop-color="#367BF5"/>
      <stop offset="1" stop-color="#08B8D8"/>
    </linearGradient>
  </defs>
  <style>
    .canvas { fill: #F8FAFD; }
    .ink { fill: #141B2A; }
    .muted { fill: #68758A; }
    .faint { fill: #A8B3C4; }
    .hairline { stroke: #DCE4EE; }
    .sans { font-family: -apple-system, BlinkMacSystemFont, 'Avenir Next', sans-serif; }
    @media (prefers-color-scheme: dark) {
      .canvas { fill: #090D14; }
      .ink { fill: #F3F6FB; }
      .muted { fill: #97A4B8; }
      .faint { fill: #4D5B70; }
      .hairline { stroke: #263247; }
    }
  </style>

  <rect class="canvas" width="850" height="218" rx="24"/>
  <circle cx="30" cy="29" r="3.5" fill="#14B8A6"/>
  <text class="sans muted" x="42" y="33" font-size="9.4" font-weight="750" letter-spacing="1.65">THREE WORKING SYSTEMS</text>
  <text class="sans faint" x="704" y="33" font-size="8" font-weight="700" letter-spacing="1.25">BROWSER · macOS · AI</text>
  <path d="M28 50H822" stroke="url(#accent)" stroke-width="2.5" stroke-linecap="round"/>

  <line class="hairline" x1="289.5" y1="70" x2="289.5" y2="192"/>
  <line class="hairline" x1="559.5" y1="70" x2="559.5" y2="192"/>

  <g transform="translate(30 0)">
    <text class="sans faint" x="0" y="81" font-size="8.5" font-weight="750" letter-spacing="1.3">01</text>
    <circle cx="25" cy="78" r="3" fill="#7C5CFF"/>
    <text class="sans muted" x="37" y="81" font-size="9" font-weight="750" letter-spacing="1.25">BROWSER SYSTEMS</text>
    <text class="sans ink" x="0" y="112" font-size="18" font-weight="770" letter-spacing="-0.45">Organize. Automate.</text>
    <text class="sans ink" x="0" y="134" font-size="18" font-weight="770" letter-spacing="-0.45">Review.</text>
    <text class="sans muted" x="0" y="158" font-size="10.2">Tools that work inside the browser</text>
    <text class="sans muted" x="0" y="173" font-size="10.2">you already use.</text>
    <text class="sans ink" x="0" y="197" font-size="8.8" font-weight="700" letter-spacing="0.35">TABWEAVE · TABWORKS · DOM AI</text>
  </g>

  <g transform="translate(318 0)">
    <text class="sans faint" x="0" y="81" font-size="8.5" font-weight="750" letter-spacing="1.3">02</text>
    <circle cx="25" cy="78" r="3" fill="#367BF5"/>
    <text class="sans muted" x="37" y="81" font-size="9" font-weight="750" letter-spacing="1.25">NATIVE macOS</text>
    <text class="sans ink" x="0" y="112" font-size="18" font-weight="770" letter-spacing="-0.45">Native utility.</text>
    <text class="sans ink" x="0" y="134" font-size="18" font-weight="770" letter-spacing="-0.45">Zero ceremony.</text>
    <text class="sans muted" x="0" y="158" font-size="10.2">Small desktop tools built to stay</text>
    <text class="sans muted" x="0" y="173" font-size="10.2">out of the way.</text>
    <text class="sans ink" x="0" y="197" font-size="8.8" font-weight="700" letter-spacing="0.35">MOCKKIT · PORTPILOT</text>
  </g>

  <g transform="translate(588 0)">
    <text class="sans faint" x="0" y="81" font-size="8.5" font-weight="750" letter-spacing="1.3">03</text>
    <circle cx="25" cy="78" r="3" fill="#08B8D8"/>
    <text class="sans muted" x="37" y="81" font-size="9" font-weight="750" letter-spacing="1.25">AI-ASSISTED CRAFT</text>
    <text class="sans ink" x="0" y="112" font-size="18" font-weight="770" letter-spacing="-0.45">Human judgment.</text>
    <text class="sans ink" x="0" y="134" font-size="18" font-weight="770" letter-spacing="-0.45">Kept in the loop.</text>
    <text class="sans muted" x="0" y="158" font-size="10.2">Use AI to inspect and refine,</text>
    <text class="sans muted" x="0" y="173" font-size="10.2">then ship with intent.</text>
    <text class="sans ink" x="0" y="197" font-size="8.8" font-weight="700" letter-spacing="0.35">INSPECT · ANNOTATE · REFINE · SHIP</text>
  </g>
</svg>
