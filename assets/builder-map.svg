<svg width="850" height="312" viewBox="0 0 850 312" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Tom's builder map</title>
  <desc id="desc">An asymmetrical map of browser systems, native macOS tools, and AI-assisted product workflows.</desc>
  <defs>
    <linearGradient id="accent" x1="49" y1="55" x2="797" y2="260" gradientUnits="userSpaceOnUse">
      <stop stop-color="#7C5CFF"/>
      <stop offset="0.5" stop-color="#367BF5"/>
      <stop offset="1" stop-color="#08B8D8"/>
    </linearGradient>
  </defs>
  <style>
    .canvas { fill: #F8FAFD; }
    .shell { fill: #E9EEF5; stroke: #D9E1EC; }
    .core { fill: #FFFFFF; stroke: #FFFFFF; }
    .ink { fill: #141B2A; }
    .muted { fill: #68758A; }
    .hairline { stroke: #D7E0EC; }
    .chip { fill: #F1F4F9; stroke: #E2E8F0; }
    .sans { font-family: 'Plus Jakarta Sans', 'Avenir Next', 'Segoe UI', sans-serif; }
    @media (prefers-color-scheme: dark) {
      .canvas { fill: #080B11; }
      .shell { fill: #111722; stroke: #1D2634; }
      .core { fill: #0C111A; stroke: #18202C; }
      .ink { fill: #F3F6FB; }
      .muted { fill: #94A1B5; }
      .hairline { stroke: #273346; }
      .chip { fill: #121925; stroke: #222E40; }
    }
  </style>

  <rect class="canvas" width="850" height="312" rx="26"/>
  <text class="sans muted" x="28" y="35" font-size="9.5" font-weight="700" letter-spacing="1.8">BUILDER MAP / THREE PLAYGROUNDS</text>
  <line class="hairline" x1="28" y1="52.5" x2="822" y2="52.5"/>

  <rect class="shell" x="27.5" y="70.5" width="455" height="214" rx="22"/>
  <rect class="core" x="33.5" y="76.5" width="443" height="202" rx="16"/>
  <text class="sans muted" x="55" y="104" font-size="10" font-weight="750" letter-spacing="1.5">01 / BROWSER SYSTEMS</text>
  <text class="sans ink" x="55" y="145" font-size="28" font-weight="720" letter-spacing="-1">Organize. Automate. Review.</text>
  <text class="sans muted" x="55" y="169" font-size="12.5">Tools that work inside the browser you already use.</text>
  <line class="hairline" x1="55" y1="191.5" x2="454" y2="191.5" stroke-dasharray="2 6"/>
  <rect class="chip" x="55.5" y="211.5" width="111" height="38" rx="19"/>
  <circle cx="75" cy="230.5" r="4" fill="#7C5CFF"/>
  <text class="sans ink" x="87" y="235" font-size="11" font-weight="700">TabWeave</text>
  <rect class="chip" x="176.5" y="211.5" width="107" height="38" rx="19"/>
  <circle cx="196" cy="230.5" r="4" fill="#367BF5"/>
  <text class="sans ink" x="208" y="235" font-size="11" font-weight="700">TabWorks</text>
  <rect class="chip" x="293.5" y="211.5" width="160" height="38" rx="19"/>
  <circle cx="313" cy="230.5" r="4" fill="#08B8D8"/>
  <text class="sans ink" x="325" y="235" font-size="11" font-weight="700">DOM AI Annotator</text>

  <rect class="shell" x="498.5" y="70.5" width="323" height="98" rx="22"/>
  <rect class="core" x="504.5" y="76.5" width="311" height="86" rx="16"/>
  <text class="sans muted" x="526" y="103" font-size="10" font-weight="750" letter-spacing="1.5">02 / NATIVE macOS</text>
  <text class="sans ink" x="526" y="132" font-size="18" font-weight="720" letter-spacing="-0.4">Native utility, zero ceremony.</text>
  <text class="sans muted" x="526" y="150" font-size="10.5">MockKit · PortPilot</text>
  <circle cx="787" cy="119" r="20" fill="url(#accent)" opacity="0.14"/>
  <path d="M779 119H795M787 111V127" stroke="url(#accent)" stroke-width="2" stroke-linecap="round"/>

  <rect class="shell" x="498.5" y="186.5" width="323" height="98" rx="22"/>
  <rect class="core" x="504.5" y="192.5" width="311" height="86" rx="16"/>
  <text class="sans muted" x="526" y="219" font-size="10" font-weight="750" letter-spacing="1.5">03 / AI-ASSISTED CRAFT</text>
  <text class="sans ink" x="526" y="248" font-size="18" font-weight="720" letter-spacing="-0.4">Human judgment stays in-loop.</text>
  <text class="sans muted" x="526" y="266" font-size="10.5">Inspect · annotate · refine · ship</text>
  <path d="M775 242L783 250L798 232" stroke="url(#accent)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
