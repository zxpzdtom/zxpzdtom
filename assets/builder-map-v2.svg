<svg width="850" height="244" viewBox="0 0 850 244" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Tom's builder map</title>
  <desc id="desc">Three equal working systems for browser tools, native macOS utilities, and AI-assisted craft.</desc>
  <defs>
    <linearGradient id="accent" x1="34" y1="68" x2="816" y2="68" gradientUnits="userSpaceOnUse">
      <stop stop-color="#7C5CFF"/>
      <stop offset="0.5" stop-color="#367BF5"/>
      <stop offset="1" stop-color="#08B8D8"/>
    </linearGradient>
  </defs>
  <style>
    .canvas { fill: #F8FAFD; }
    .shell { fill: #EAF0F7; stroke: #DAE3EF; }
    .core { fill: #FFFFFF; }
    .ink { fill: #141B2A; }
    .muted { fill: #68758A; }
    .faint { fill: #AAB5C5; }
    .hairline { stroke: #DCE4EE; }
    .sans { font-family: -apple-system, BlinkMacSystemFont, 'Avenir Next', sans-serif; }
    @media (prefers-color-scheme: dark) {
      .canvas { fill: #080B11; }
      .shell { fill: #121925; stroke: #202A39; }
      .core { fill: #0C111A; }
      .ink { fill: #F3F6FB; }
      .muted { fill: #98A5B8; }
      .faint { fill: #516076; }
      .hairline { stroke: #263247; }
    }
  </style>

  <rect class="canvas" width="850" height="244" rx="26"/>
  <circle cx="30" cy="30" r="3.5" fill="#14B8A6"/>
  <text class="sans muted" x="42" y="34" font-size="9.5" font-weight="750" letter-spacing="1.7">BUILDER MAP / 01—03</text>
  <text class="sans faint" x="822" y="34" font-size="8.5" font-weight="700" letter-spacing="1.5" text-anchor="end">THREE WORKING SYSTEMS</text>
  <line class="hairline" x1="28" y1="48.5" x2="822" y2="48.5"/>

  <rect class="shell" x="27.5" y="61.5" width="795" height="158" rx="22"/>
  <rect class="core" x="33.5" y="67.5" width="783" height="146" rx="16"/>
  <path d="M50 68H800" stroke="url(#accent)" stroke-width="2.5" stroke-linecap="round"/>
  <line class="hairline" x1="294.5" y1="88" x2="294.5" y2="194"/>
  <line class="hairline" x1="555.5" y1="88" x2="555.5" y2="194"/>

  <g transform="translate(55 0)">
    <text class="sans muted" x="0" y="99" font-size="9.5" font-weight="750" letter-spacing="1.4">01 / BROWSER SYSTEMS</text>
    <text class="sans faint" x="214" y="99" font-size="9" font-weight="750" text-anchor="end">01</text>
    <rect x="0" y="116" width="3" height="36" rx="1.5" fill="#7C5CFF"/>
    <text class="sans ink" x="14" y="130" font-size="17" font-weight="760" letter-spacing="-0.35">ORGANIZE / AUTOMATE</text>
    <text class="sans ink" x="14" y="151" font-size="17" font-weight="760" letter-spacing="-0.35">REVIEW</text>
    <circle cx="2.5" cy="178" r="2.5" fill="#7C5CFF"/>
    <text class="sans muted" x="14" y="181.5" font-size="9.5" font-weight="650">TABWEAVE · TABWORKS</text>
    <text class="sans muted" x="14" y="197" font-size="9.5" font-weight="650">DOM AI ANNOTATOR</text>
  </g>

  <g transform="translate(316 0)">
    <text class="sans muted" x="0" y="99" font-size="9.5" font-weight="750" letter-spacing="1.4">02 / NATIVE macOS</text>
    <text class="sans faint" x="214" y="99" font-size="9" font-weight="750" text-anchor="end">02</text>
    <rect x="0" y="116" width="3" height="36" rx="1.5" fill="#367BF5"/>
    <text class="sans ink" x="14" y="130" font-size="17" font-weight="760" letter-spacing="-0.35">NATIVE UTILITY /</text>
    <text class="sans ink" x="14" y="151" font-size="17" font-weight="760" letter-spacing="-0.35">ZERO CEREMONY</text>
    <circle cx="2.5" cy="178" r="2.5" fill="#367BF5"/>
    <text class="sans muted" x="14" y="181.5" font-size="9.5" font-weight="650">MOCKKIT · PORTPILOT</text>
    <text class="sans muted" x="14" y="197" font-size="9.5" font-weight="650">DEVTOOLS · PORTS</text>
  </g>

  <g transform="translate(577 0)">
    <text class="sans muted" x="0" y="99" font-size="9.5" font-weight="750" letter-spacing="1.4">03 / AI-ASSISTED CRAFT</text>
    <text class="sans faint" x="214" y="99" font-size="9" font-weight="750" text-anchor="end">03</text>
    <rect x="0" y="116" width="3" height="36" rx="1.5" fill="#08B8D8"/>
    <text class="sans ink" x="14" y="130" font-size="17" font-weight="760" letter-spacing="-0.35">HUMAN IN LOOP /</text>
    <text class="sans ink" x="14" y="151" font-size="17" font-weight="760" letter-spacing="-0.35">SHIP WITH INTENT</text>
    <circle cx="2.5" cy="178" r="2.5" fill="#08B8D8"/>
    <text class="sans muted" x="14" y="181.5" font-size="9.5" font-weight="650">INSPECT · ANNOTATE</text>
    <text class="sans muted" x="14" y="197" font-size="9.5" font-weight="650">REFINE · SHIP</text>
  </g>
</svg>
