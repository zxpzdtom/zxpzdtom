<svg xmlns="http://www.w3.org/2000/svg" width="400" height="158" viewBox="0 0 400 158" role="img" aria-labelledby="title desc">
  <title id="title">PortPilot</title>
  <desc id="desc">See which process owns a local port right from your macOS menu bar.</desc>
